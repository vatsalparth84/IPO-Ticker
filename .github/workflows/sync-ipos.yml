# Refreshes ipos.json from IPO Ji (+ IPO Premium) every 30 minutes and commits it only when something changed (ipos.json + details/).
name: Sync IPO list
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: sync-ipos
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest IPO list
        run: node scripts/sync.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain ipos.json details)" ]; then
            git config user.name  "ipo-sync-bot"
            git config user.email "ipo-sync-bot@users.noreply.github.com"
            git add -A ipos.json details
            git commit -m "Update IPO list"
            git push
          else
            echo "nothing changed"
          fi
